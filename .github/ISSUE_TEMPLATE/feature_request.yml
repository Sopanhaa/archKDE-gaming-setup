name: Feature request
description: Suggest an improvement for the installer or documentation
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user problem or limitation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the change you would like to see
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation workflow
        - GPU detection or drivers
        - KDE or desktop services
        - Gaming tools
        - Flatpak
        - Performance setup
        - Virtualization
        - Documentation
        - Other
    validations:
      required: true
