name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Lint and dry-run on Arch Linux
        run: |
          docker run --rm \
            -v "$PWD:/host:ro" \
            archlinux@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239 \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed sudo shellcheck curl git >/dev/null
              useradd -m -s /bin/bash tester
              mkdir -p /work
              cp -a /host/. /work/
              rm -rf /work/.git
              chown -R tester:tester /work
              su tester -c "cd /work && bash scripts/lint.sh"
              su tester -c "cd /work && ./install.sh --dry-run --full --no-color"
            '
